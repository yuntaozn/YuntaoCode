[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuntaocode"
dynamic = ["version"]
description = "YuntaoCode - 云涛智能终端，本地优先的 AI Task Runtime 基座"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "沈阳云涛智能科技有限公司", email = "wutaoplay@outlook.com"}
]
keywords = ["ai", "local", "terminal", "code", "automation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tornado>=6.4",
    "tiktoken>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
documents = [
    "python-docx>=0.8.11",
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.24.0",
    "markdown>=3.6",
    "python-pptx>=0.6.23",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]
web = [
    "playwright>=1.40.0",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
all = [
    "python-docx>=0.8.11",
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.24.0",
    "markdown>=3.6",
    "python-pptx>=0.6.23",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "playwright>=1.40.0",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/yuntaozn/YuntaoCode"
Repository = "https://github.com/yuntaozn/YuntaoCode"
Issues = "https://github.com/yuntaozn/YuntaoCode/issues"
Changelog = "https://github.com/yuntaozn/YuntaoCode/blob/main/CHANGELOG.md"

[project.scripts]
yuntaocode = "runtime.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "providers*"]

[tool.setuptools.dynamic]
version = {attr = "runtime.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
