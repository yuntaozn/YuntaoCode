<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="plugins_page.title">能力与插件 - YuntaoCode</title>
    <link rel="stylesheet" href="/static/panel.css?v=20260621-4">
    <style>
        /* 插件页面专用样式 */
        .plugin-group-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text);
            text-align: left;
            transition: background 0.15s;
        }
        .plugin-group-item:hover { background: var(--soft); }
        .plugin-group-item.active {
            background: var(--soft);
            color: var(--text);
            font-weight: 600;
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .dep-badge { color: var(--danger); font-size: 11px; }
        .plugin-group-item.active .dep-badge { color: var(--danger); }
        .plugin-group-heading {
            margin: 12px 0 5px;
            padding: 0 12px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0;
        }
        .sample-badge-mini {
            color: var(--muted);
            font-size: 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 1px 6px;
        }

        .plugin-guidance {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
            background: var(--panel);
        }
        .plugin-guidance-title {
            margin: 0 0 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        .plugin-guidance-copy {
            margin: 0;
            font-size: 13px;
            line-height: 1.55;
            color: var(--muted);
        }
        .plugin-draft-path {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
            word-break: break-all;
        }
        .plugin-example-prompt {
            margin: 10px 0 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--soft);
            color: var(--text);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .plugin-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            background: var(--panel);
            transition: opacity 0.2s;
        }
        .plugin-card.disabled { opacity: 0.55; }
        .plugin-provider-section {
            margin-bottom: 18px;
        }
        .plugin-provider-heading {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }
        .plugin-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }
        .plugin-card-info h3 { margin: 0 0 4px; font-size: 15px; }
        .plugin-card-info p { margin: 0; font-size: 13px; color: var(--muted); }
        .plugin-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .plugin-status-badge {
            display: inline-flex;
            align-items: center;
            height: 20px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--soft);
            color: var(--muted);
            border: 1px solid var(--line);
            font-size: 11px;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--line-strong);
            border-radius: 22px;
            transition: background 0.2s;
            cursor: pointer;
        }
        .toggle-slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

        .plugin-deps {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .deps-label { font-size: 12px; color: var(--muted); }
        .dep-item {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--soft);
        }
        .dep-item.ok { color: var(--success); }
        .dep-item.missing { color: var(--danger); background: #fff0f0; }
        .dep-item.requirement { color: var(--muted); }

        .plugin-meta {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .plugin-tools {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tool-chip {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--soft);
            color: var(--muted);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 9999;
            animation: toast-in 0.2s ease;
        }
        @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="nav-rail" aria-label="主导航" data-i18n-aria-label="nav.main_nav">
            <button class="rail-action" id="back-btn" title="返回对话" data-i18n-title="nav.back">←<span data-i18n="nav.back">返回</span></button>
            <button class="rail-action active" id="plugins-main-btn" title="能力" data-i18n-title="nav.plugins">⌘<span data-i18n="nav.plugins">能力</span></button>
            <button class="rail-action" id="mcp-services-btn" title="MCP" data-i18n-title="nav.mcp_services">◇<span data-i18n="nav.mcp_services">MCP</span></button>
        </aside>

        <aside class="sidebar" style="width: 240px;">
            <section class="account-block">
                <div>
                    <div class="block-title" data-i18n="plugins_page.overview">能力总览</div>
                    <div class="status-line" id="plugin-summary" data-i18n="settings_page.loading">读取中...</div>
                </div>
            </section>
            <section class="sidebar-section">
                <div class="section-title" data-i18n="plugins_page.groups">能力来源</div>
                <div class="plugin-group-list" id="plugin-group-list"></div>
            </section>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <div class="workspace-name" data-i18n="plugins_page.heading">能力与插件</div>
                    <div class="workspace-path" data-i18n="plugins_page.subtitle">查看内置能力、MCP 能力和本机能力包</div>
                </div>
                <div class="topbar-right">
                    <button class="secondary-button" id="refresh-plugins-btn" data-i18n="plugins_page.refresh">刷新</button>
                </div>
            </header>
            <section class="chat-panel" style="padding: 20px; overflow: auto;">
                <div class="plugin-guidance">
                    <div class="plugin-guidance-title" data-i18n="plugins_page.ai_draft_title">本机能力包</div>
                    <p class="plugin-guidance-copy" data-i18n="plugins_page.ai_draft_desc">AI 可以先把经验沉淀为方法型能力包，例如提示词、步骤、反例和验证清单。只有确实需要新执行能力时，才创建更严格的工具适配器草稿。</p>
                    <pre class="plugin-example-prompt" data-i18n="plugins_page.ai_draft_example">示例：请根据这次成功任务创建一个方法型能力包，只写入能力包草稿目录，包含 SKILL.md、适用场景、步骤、验证清单和反例；不要修改内置运行时代码。</pre>
                    <div class="plugin-draft-path" id="ai-plugin-draft-root"></div>
                </div>
                <div id="plugin-list-full"></div>
            </section>
        </main>
    </div>

    <script src="/static/i18n.js?v=20260622-2"></script>
    <script src="/static/plugins.js?v=20260621-5"></script>
</body>
</html>
