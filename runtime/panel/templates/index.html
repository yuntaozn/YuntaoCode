<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuntaoCode</title>
    <link rel="stylesheet" href="/static/panel.css?v=20260531-3">
</head>
<body>
    <div class="app-shell">
        <aside class="nav-rail" aria-label="主导航" data-i18n-aria-label="nav.main_nav">
            <button class="rail-action active" id="new-conversation-btn" title="新对话" data-i18n-title="nav.new_conversation">✎<span data-i18n="nav.new_conversation">新对话</span></button>
            <button class="rail-action" id="focus-search-btn" title="搜索历史" data-i18n-title="nav.search">⌕<span data-i18n="nav.search">搜索</span></button>
            <button class="rail-action" id="open-plugins-btn" title="插件" data-i18n-title="nav.plugins">⌘<span data-i18n="nav.plugins">插件</span></button>
            <button class="rail-action" title="自动化" data-i18n-title="nav.automation">◷<span data-i18n="nav.automation">自动化</span></button>
            <button class="rail-action rail-bottom" id="open-settings-btn" title="设置" data-i18n-title="nav.settings">⚙<span data-i18n="nav.settings">设置</span></button>
            <button class="rail-action hidden" id="logout-btn" title="退出登录" data-i18n-title="nav.logout">↪<span data-i18n="nav.logout">退出</span></button>
        </aside>

        <aside class="sidebar">
            <section class="account-block">
                <div>
                    <div class="block-title" data-i18n="sidebar.backend_account">后台账号</div>
                    <div class="status-line" id="backend-state" data-i18n="sidebar.not_logged_in">未登录</div>
                </div>
                <button class="ghost-button" id="open-login-btn" data-i18n="sidebar.login">登录</button>
            </section>

            <section class="model-block">
                <div class="block-title" data-i18n="sidebar.model">模型</div>
                <select id="model-select" aria-label="模型" data-i18n-aria-label="sidebar.model">
                    <option value="doubao-seed-2-0-pro-260215">豆包 Seed 2.0 Pro</option>
                    <option value="doubao-seed-2-0-code-preview-260215">豆包 Seed 2.0 编程加强版</option>
                    <!-- <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>     -->
                    <option value="qwen3.6-flash">Qwen3.6 Flash</option>
                    <option value="qwen3.6-max-preview">Qwen3.6 Max Preview</option>
                    <option value="qwen3.7-max">Qwen3.7 Max</option>
                    <option value="qwen3.7-max-preview">Qwen3.7 Max Preview</option>
                </select>
            </section>

            <section class="sidebar-section">
                <div class="section-title-row">
                    <div class="section-title" data-i18n="sidebar.project_dirs">项目目录</div>
                    <div class="mini-actions">
                        <button class="ghost-button compact-button" id="pick-workspace-btn" title="选择工作空间" data-i18n-title="sidebar.select_folder" data-i18n="sidebar.select_short">选择</button>
                    </div>
                </div>
                <div class="workspace-list" id="workspace-list"></div>
            </section>

            <section class="sidebar-section conversations-section">
                <div class="section-title" data-i18n="sidebar.conversations">对话</div>
                <input class="full-input" id="conversation-search-input" type="search" placeholder="搜索历史对话" data-i18n-placeholder="sidebar.search_history">
                <div class="conversation-list" id="conversation-list"></div>
            </section>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <div class="workspace-name" id="current-workspace-name" data-i18n="topbar.select_project">选择项目目录</div>
                    <div class="workspace-path" id="current-workspace-path" data-i18n="topbar.bind_conversation">对话会绑定到当前项目</div>
                </div>
                <div class="topbar-right">
                    <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);">
                        <select id="language-select" style="padding:2px 4px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12px;">
                            <option value="zh-CN">中文</option>
                            <option value="en">English</option>
                        </select>
                    </label>
                    <div class="mode-switcher" id="mode-switcher"></div>
                    <div class="topbar-actions">
                        <span id="tool-summary" data-i18n="topbar.tools_not_loaded">工具未加载</span>
                        <span id="model-summary" data-i18n="topbar.local_placeholder">本地占位模式</span>
                    </div>
                </div>
            </header>

            <section class="chat-panel" id="chat-panel">
                <div class="messages" id="messages"></div>
                <div class="streaming-status-bar hidden" id="streaming-status-bar">
                    <div class="status-bar-inner">
                        <span class="status-bar-dot"></span>
                        <span class="status-bar-text" id="streaming-status-text" data-i18n="status.executing">正在执行</span>
                        <span class="status-bar-elapsed" id="streaming-status-elapsed"></span>
                    </div>
                    <div class="status-bar-actions hidden" id="status-bar-actions">
                        <button type="button" class="status-bar-btn confirm-btn" id="confirm-continue-btn" data-i18n="status.continue_exec">继续执行</button>
                        <button type="button" class="status-bar-btn cancel-btn" id="confirm-cancel-btn" data-i18n="status.stop_btn">停止</button>
                    </div>
                </div>
                <form class="composer" id="composer">
                    <div class="mention-menu hidden" id="mention-menu"></div>
                    <div class="image-preview hidden" id="image-preview"></div>
                    <textarea id="message-input" rows="2" placeholder="向 YuntaoCode 提问，输入 @ 可提及工具或文件" data-i18n-placeholder="composer.placeholder"></textarea>
                    <input type="file" id="image-file-input" accept="image/*" style="display:none">
                    <div class="composer-footer">
                        <div class="composer-left">
                            <button type="button" class="composer-action" id="upload-image-btn" title="上传图片" data-i18n-title="composer.upload_image">🖼</button>
                            <button type="button" class="plan-mode-btn" id="plan-mode-btn" title="计划执行模式" data-i18n="composer.plan_auto">计划: 自动</button>
                            <span class="composer-meta" id="composer-meta" data-i18n="composer.select_project_first">先选择项目目录，再开始对话</span>
                            <span class="token-battery hidden" id="token-battery" title="点击压缩上下文" data-i18n-title="context.compress_click">
                                <span class="battery-body">
                                    <span class="battery-fill" id="battery-fill"></span>
                                </span>
                                <span class="battery-cap"></span>
                                <span class="battery-text" id="battery-text"></span>
                            </span>
                        </div>
                        <button id="send-btn" type="submit" data-i18n="composer.send">发送</button>
                    </div>
                </form>
            </section>
        </main>

        <dialog id="settings-dialog">
            <form method="dialog" class="settings-panel" id="settings-form">
                <div class="dialog-head">
                    <div>
                        <h2 data-i18n="settings.title">设置</h2>
                        <p data-i18n="settings.key_hint">模型 Key 保存在本机用户配置目录，不写入项目目录。</p>
                    </div>
                    <button class="icon-close" value="cancel" aria-label="关闭" data-i18n-title="settings.close">×</button>
                </div>
                <label>
                    <span data-i18n="settings.volcengine_key">火山方舟 API Key</span>
                    <input id="volcengine-key-input" type="password" placeholder="留空表示不修改" data-i18n-placeholder="settings.leave_empty">
                    <span class="hint-line" id="volcengine-key-hint" data-i18n="settings.not_configured">未配置</span>
                </label>
                <label>
                    <span data-i18n="settings.qwen_key">通义千问 API Key</span>
                    <input id="qwen-key-input" type="password" placeholder="留空表示不修改" data-i18n-placeholder="settings.leave_empty">
                    <span class="hint-line" id="qwen-key-hint" data-i18n="settings.not_configured">未配置</span>
                </label>
                <div class="settings-section">
                    <div class="settings-section-head">
                        <h3 data-i18n="settings.execution_perms">执行与权限</h3>
                    </div>
                    <label>
                        <span data-i18n="settings.file_access">文件访问权限</span>
                        <select id="access-scope-input">
                            <option value="project_only" data-i18n="settings.access_project">当前项目目录</option>
                            <option value="full_local" data-i18n="settings.access_full">完全本机权限</option>
                        </select>
                        <span class="hint-line" data-i18n="settings.access_full_warning">完全本机权限会允许 AI 访问本机当前用户可访问的路径，请谨慎开启。</span>
                    </label>
                    <label>
                        <span data-i18n="settings.exec_mode">执行模式</span>
                        <select id="execution-mode-input">
                            <option value="conservative" data-i18n="settings.exec_conservative">保守：少自动执行</option>
                            <option value="auto" data-i18n="settings.exec_auto">自动：系统判断</option>
                            <option value="aggressive" data-i18n="settings.exec_aggressive">激进：强制计划与验证</option>
                        </select>
                    </label>
                </div>
                <div class="settings-section">
                    <div class="settings-section-head">
                        <h3 data-i18n="settings.code_backup">代码备份</h3>
                        <span class="hint-line" id="backup-storage-hint" data-i18n="settings_page.loading">读取中</span>
                    </div>
                    <label class="checkbox-line">
                        <input id="backup-enabled-input" type="checkbox">
                        <span data-i18n="settings.auto_checkpoint">写入前自动创建回退点</span>
                    </label>
                    <label>
                        <span data-i18n="settings.keep_recent">保留最近批次</span>
                        <input id="backup-keep-input" type="number" min="1" max="100" step="1">
                    </label>
                    <div class="backup-actions">
                        <button class="secondary-button" id="refresh-backups-btn" type="button" data-i18n="settings.refresh">刷新</button>
                        <button class="secondary-button" id="restore-latest-backup-btn" type="button" data-i18n="settings.restore_latest">恢复最近一次</button>
                        <button class="secondary-button danger-button" id="clear-backups-btn" type="button" data-i18n="settings.clear_backups">清空备份</button>
                    </div>
                    <div class="backup-list" id="backup-list"></div>
                </div>
                <div class="dialog-actions">
                    <button class="secondary-button" value="cancel" data-i18n="settings.cancel">取消</button>
                    <button class="primary-button" id="save-settings-btn" type="button" data-i18n="settings.save">保存</button>
                </div>
            </form>
        </dialog>

        <dialog id="plugins-dialog">
            <form method="dialog" class="settings-panel">
                <div class="dialog-head">
                    <div>
                        <h2 data-i18n="plugins.title">插件</h2>
                        <p data-i18n="plugins.desc">本地技能会以插件形式管理，后续可扩展启停、权限和配置。</p>
                    </div>
                    <button class="icon-close" value="cancel" aria-label="关闭" data-i18n-title="settings.close">×</button>
                </div>
                <div class="plugin-list" id="plugin-list"></div>
                <h2 data-i18n="plugins.recent_tasks">最近任务</h2>
                <pre id="last-task-output" data-i18n="plugins.no_tasks">暂无任务</pre>
            </form>
        </dialog>

        <dialog id="login-dialog">
            <form method="dialog" class="login-panel" id="backend-login-form">
                <div class="dialog-head">
                    <div>
                        <h2 data-i18n="login.title">登录后台</h2>
                    </div>
                    <button class="icon-close" value="cancel" aria-label="关闭" data-i18n-title="settings.close">×</button>
                </div>
                <input id="backend-url-input" type="hidden" value="http://39.96.116.210:8089">
                <label>
                    <span data-i18n="login.username">用户名</span>
                    <input id="username-input" type="text" autocomplete="username">
                </label>
                <label>
                    <span data-i18n="login.password">密码</span>
                    <input id="password-input" type="password" autocomplete="current-password">
                </label>
                <div class="dialog-actions">
                    <a href="http://tool.yuntao99.com/register.html" target="_blank" style="margin-right: auto; color: var(--primary); font-size: 13px;" data-i18n="login.register_link">没有账号？去注册</a>
                    <button class="secondary-button" value="cancel" data-i18n="login.cancel">取消</button>
                    <button class="primary-button" id="backend-login-btn" type="button" data-i18n="login.login_btn">登录</button>
                </div>
            </form>
        </dialog>
    </div>

    <script src="/static/i18n.js?v=20260531-2"></script>
    <script src="/static/panel.js?v=20260531-5"></script>
</body>
</html>
