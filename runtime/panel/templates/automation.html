<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="automation_page.title">自动化 - YuntaoCode</title>
    <link rel="stylesheet" href="/static/panel.css?v=20260814-1">
    <style>
        .automation-list { display: grid; gap: 8px; }
        .automation-item {
            width: 100%;
            padding: 10px 12px;
            color: var(--text);
            text-align: left;
            background: transparent;
            border-radius: 8px;
        }
        .automation-item:hover,
        .automation-item.active {
            background: var(--soft);
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .automation-item-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 650;
        }
        .automation-item-meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }
        .automation-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            flex: 0 0 auto;
        }
        .automation-dot.active { background: var(--success); }
        .automation-dot.paused { background: #b98900; }
        .automation-dot.disabled,
        .automation-dot.draft { background: var(--muted); }
        .automation-shell {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 20px 22px;
            background: var(--panel);
        }
        .automation-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .automation-hint {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .automation-grid {
            display: grid;
            grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }
        .automation-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 16px;
        }
        .automation-card h2 {
            margin: 0 0 12px;
            font-size: 15px;
        }
        .automation-form {
            display: grid;
            gap: 12px;
        }
        .automation-form label {
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }
        .automation-form input,
        .automation-form select,
        .automation-form textarea {
            width: 100%;
            min-width: 0;
            padding: 8px 10px;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 13px;
        }
        .automation-form textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.45;
        }
        .automation-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .automation-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .automation-actions button {
            min-height: 34px;
        }
        .automation-empty {
            padding: 48px 20px;
            color: var(--muted);
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: var(--soft);
        }
        .automation-preview {
            display: grid;
            gap: 10px;
        }
        .automation-preview-row {
            display: grid;
            grid-template-columns: 96px minmax(0, 1fr);
            gap: 10px;
            font-size: 13px;
        }
        .automation-preview-row span:first-child {
            color: var(--muted);
        }
        .automation-preview-row span:last-child {
            word-break: break-word;
        }
        .automation-subtle {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
        @media (max-width: 1050px) {
            .automation-grid,
            .automation-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="nav-rail" aria-label="主导航" data-i18n-aria-label="nav.main_nav">
            <button class="rail-action" id="back-btn" title="返回对话" data-i18n-title="nav.back">←<span data-i18n="nav.back">返回</span></button>
            <button class="rail-action" id="plugins-btn" title="能力" data-i18n-title="nav.plugins">⌘<span data-i18n="nav.plugins">能力</span></button>
            <button class="rail-action" id="mcp-services-btn" title="MCP" data-i18n-title="nav.mcp_services">◇<span data-i18n="nav.mcp_services">MCP</span></button>
            <button class="rail-action active" id="automation-main-btn" title="自动化" data-i18n-title="nav.automation">◷<span data-i18n="nav.automation">自动化</span></button>
        </aside>

        <aside class="sidebar">
            <section class="account-block">
                <div>
                    <div class="block-title" data-i18n="automation_page.overview">自动化总览</div>
                    <div class="status-line" id="automation-summary" data-i18n="settings_page.loading">读取中...</div>
                </div>
            </section>
            <section class="sidebar-section">
                <div class="section-title-row">
                    <div class="section-title" data-i18n="automation_page.saved_tasks">自动化任务</div>
                    <button class="ghost-button compact-button" id="new-automation-btn" data-i18n="automation_page.new_short">新增</button>
                </div>
                <div class="automation-list" id="automation-list"></div>
            </section>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <div class="workspace-name" data-i18n="automation_page.heading">自动化</div>
                    <div class="workspace-path" data-i18n="automation_page.subtitle">配置可手动或定时触发的普通任务运行。</div>
                </div>
                <div class="topbar-right">
                    <button class="secondary-button" id="refresh-btn" data-i18n="automation_page.refresh">刷新</button>
                    <button class="primary-button" id="save-btn" data-i18n="automation_page.save">保存自动化</button>
                </div>
            </header>

            <section class="automation-shell">
                <div class="automation-grid">
                    <form class="automation-card automation-form" id="automation-form">
                        <h2 data-i18n="automation_page.form_title">任务设置</h2>
                        <label>
                            <span data-i18n="automation_page.name">名称</span>
                            <input id="automation-name" type="text" data-i18n-placeholder="automation_page.name_placeholder" placeholder="例如：每天检查失败任务">
                        </label>
                        <label>
                            <span data-i18n="automation_page.goal">任务内容</span>
                            <textarea id="automation-goal" data-i18n-placeholder="automation_page.goal_placeholder" placeholder="写下要让 YuntaoCode 定时执行的自然语言任务"></textarea>
                        </label>
                        <div class="automation-row">
                            <label>
                                <span data-i18n="automation_page.workspace">工作区</span>
                                <select id="automation-workspace"></select>
                            </label>
                            <label>
                                <span data-i18n="automation_page.model">模型</span>
                                <select id="automation-model"></select>
                            </label>
                        </div>
                        <div class="automation-row">
                            <label>
                                <span data-i18n="automation_page.trigger_kind">触发方式</span>
                                <select id="automation-trigger-kind">
                                    <option value="manual" data-i18n="automation_page.trigger_manual">手动</option>
                                    <option value="once" data-i18n="automation_page.trigger_once">一次性</option>
                                    <option value="interval" data-i18n="automation_page.trigger_interval">固定间隔</option>
                                    <option value="daily" data-i18n="automation_page.trigger_daily">每日</option>
                                    <option value="weekly" data-i18n="automation_page.trigger_weekly">每周</option>
                                </select>
                            </label>
                            <label>
                                <span data-i18n="automation_page.state">状态</span>
                                <select id="automation-state">
                                    <option value="active" data-i18n="automation_page.state_active">启用</option>
                                    <option value="paused" data-i18n="automation_page.state_paused">暂停</option>
                                    <option value="disabled" data-i18n="automation_page.state_disabled">禁用</option>
                                </select>
                            </label>
                        </div>
                        <div class="automation-row">
                            <label id="automation-run-at-field" data-trigger-field="once">
                                <span data-i18n="automation_page.run_at">一次性时间</span>
                                <input id="automation-run-at" type="datetime-local">
                            </label>
                            <label id="automation-time-of-day-field" data-trigger-field="daily weekly">
                                <span data-i18n="automation_page.time_of_day">每日/每周时间</span>
                                <input id="automation-time-of-day" type="time">
                            </label>
                        </div>
                        <div class="automation-row">
                            <label id="automation-interval-field" data-trigger-field="interval">
                                <span data-i18n="automation_page.interval_minutes">间隔分钟</span>
                                <input id="automation-interval-minutes" type="number" min="1" step="1" value="60">
                            </label>
                            <label id="automation-weekday-field" data-trigger-field="weekly">
                                <span data-i18n="automation_page.weekday">每周星期</span>
                                <select id="automation-weekday">
                                    <option value="mon" data-i18n="automation_page.weekday_mon">周一</option>
                                    <option value="tue" data-i18n="automation_page.weekday_tue">周二</option>
                                    <option value="wed" data-i18n="automation_page.weekday_wed">周三</option>
                                    <option value="thu" data-i18n="automation_page.weekday_thu">周四</option>
                                    <option value="fri" data-i18n="automation_page.weekday_fri">周五</option>
                                    <option value="sat" data-i18n="automation_page.weekday_sat">周六</option>
                                    <option value="sun" data-i18n="automation_page.weekday_sun">周日</option>
                                </select>
                            </label>
                        </div>
                        <div class="automation-row">
                            <label>
                                <span data-i18n="automation_page.planning">计划策略</span>
                                <select id="automation-planning">
                                    <option value="auto" data-i18n="automation_page.policy_auto">自动</option>
                                    <option value="off" data-i18n="automation_page.policy_off">直接</option>
                                    <option value="always" data-i18n="automation_page.policy_always">始终计划</option>
                                </select>
                            </label>
                            <label>
                                <span data-i18n="automation_page.confirmation">执行确认</span>
                                <select id="automation-confirmation">
                                    <option value="auto" data-i18n="automation_page.policy_auto">自动</option>
                                    <option value="conservative" data-i18n="automation_page.confirm_conservative">保守</option>
                                    <option value="aggressive" data-i18n="automation_page.confirm_aggressive">激进</option>
                                </select>
                            </label>
                        </div>
                        <div class="automation-row">
                            <label>
                                <span data-i18n="automation_page.access">访问权限</span>
                                <select id="automation-access">
                                    <option value="project_only" data-i18n="automation_page.access_project">当前项目</option>
                                    <option value="full_local" data-i18n="automation_page.access_full">本机权限</option>
                                </select>
                            </label>
                            <label>
                                <span data-i18n="automation_page.concurrency">并发策略</span>
                                <select id="automation-concurrency">
                                    <option value="skip_if_running" data-i18n="automation_page.concurrent_skip">运行中则跳过</option>
                                    <option value="queue_next" data-i18n="automation_page.concurrent_queue">运行中则排队</option>
                                    <option value="allow_parallel" data-i18n="automation_page.concurrent_parallel">允许并行</option>
                                </select>
                            </label>
                        </div>
                        <div class="automation-actions">
                            <button class="primary-button" type="submit" data-i18n="automation_page.save">保存自动化</button>
                            <button class="secondary-button" id="run-now-btn" type="button" data-i18n="automation_page.run_now">立即运行</button>
                            <button class="secondary-button" id="reset-btn" type="button" data-i18n="automation_page.reset">重置</button>
                            <button class="danger-button" id="delete-btn" type="button" data-i18n="automation_page.delete">删除</button>
                        </div>
                        <p class="automation-subtle" data-i18n="automation_page.run_hint">立即运行会创建一个待启动 Run，并跳回主对话使用正常执行流启动。</p>
                    </form>

                    <div class="automation-card">
                        <h2 data-i18n="automation_page.detail_title">当前自动化</h2>
                        <div id="automation-empty" class="automation-empty hidden" data-i18n="automation_page.empty">还没有自动化任务，点击新增开始配置。</div>
                        <div id="automation-preview" class="automation-preview"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/i18n.js?v=20260814-1"></script>
    <script src="/static/confirm-dialog.js?v=20260814-1"></script>
    <script src="/static/automation.js?v=20260814-1"></script>
</body>
</html>
