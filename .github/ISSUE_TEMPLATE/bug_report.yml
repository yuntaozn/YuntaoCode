name: Bug report
description: Report a reproducible problem in YuntaoCode.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, workspace setup, model provider, and relevant files if possible.
      placeholder: |
        1. Start runtime with ...
        2. Open ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or commit SHA"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime
        - Tools
        - Memory
        - Model provider
        - Desktop shell
        - Documentation
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens, local private paths, and user data before posting.
