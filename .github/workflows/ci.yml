name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  python:
    name: Python runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run core smoke test
        run: python scripts/smoke_core.py

      - name: Compile core Python modules
        run: |
          python -m py_compile \
            runtime/app.py \
            runtime/task_runner.py \
            runtime/tool_registry.py \
            runtime/security.py \
            runtime/api/tasks.py \
            runtime/api/plugins.py \
            runtime/model_providers/client.py

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-shell
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check src/main.js

      - name: Build frontend
        run: npm run build:ui

  tauri:
    name: Tauri shell check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-shell
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:ui

      - name: Prepare sidecar placeholder for cargo check
        run: powershell -ExecutionPolicy Bypass -File ..\scripts\prepare_tauri_check.ps1

      - name: Check Tauri crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
